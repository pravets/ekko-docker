name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: shell syntax
        run: bash -n scripts/verify.sh scripts/check-base.sh

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build --build-arg RUNTIME_UID=1000 --build-arg RUNTIME_GID=1000 -t ekko-docker:ci .

      # Variant B runtime contract: container starts as root, services drop to
      # HERMES_UID. This boots the real image, waits for :6060, asserts the s6
      # tree and gateway detection, then kills the server and asserts the
      # container goes down.
      - name: verify supervised runtime
        run: ./scripts/verify.sh ekko-docker:ci

      - name: container logs on failure
        if: failure()
        run: docker logs --tail 100 $(docker ps -aq | head -1) || true
