name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: shell syntax
        run: bash -n scripts/verify.sh scripts/check-base.sh

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build --build-arg RUNTIME_UID=1000 --build-arg RUNTIME_GID=1000 -t ekko-docker:ci .
      - name: verify as non-root uid 1000
        run: RUNTIME_UID=1000 RUNTIME_GID=1000 ./scripts/verify.sh ekko-docker:ci
